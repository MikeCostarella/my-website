<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trumbull County Access to Care</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #1F3A5F;
    --navy-deep: #15294A;
    --gold: #C49B43;
    --gold-soft: #E8D49A;
    --bg: #F7F4ED;
    --bg-card: #FFFFFF;
    --ink: #1A1F2E;
    --ink-soft: #4A5163;
    --rule: #D8D0C0;
    --rule-soft: #E9E2D4;
    --shadow: 0 1px 2px rgba(21,41,74,.06), 0 4px 12px rgba(21,41,74,.04);
    --shadow-lg: 0 4px 8px rgba(21,41,74,.08), 0 16px 40px rgba(21,41,74,.10);

    /* Type-specific colors for markers and legend */
    --t-hospital: #B5394A;
    --t-fqhc: #2E7D5B;
    --t-urgent: #D97706;
    --t-primary: #1F3A5F;
    --t-pharmacy: #6B46C1;
    --t-dental: #0E7C9B;
    --t-mh: #B45F2E;
    --t-vision: #3B6E8F;
    --t-specialty: #6B6557;
    --t-health: #7A1F3D;
    --t-pp: #C2185B;
    --t-other: #555;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============ App layout ============ */
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    /* 100vh fallback for older browsers; 100dvh is the "dynamic viewport
       height" unit that correctly accounts for mobile browser URL bars
       expanding and collapsing. Without dvh, iOS Safari can render the
       map area as zero pixels tall. */
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* ============ Header ============ */
  header {
    background: var(--navy);
    color: #FFFFFF;
    padding: 18px 28px 16px;
    border-bottom: 3px solid var(--gold);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .sub {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--gold-soft);
    font-weight: 500;
  }
  header .meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 3px;
    line-height: 1.35;
  }
  header .meta .credit {
    font-size: 0.78rem;
    color: var(--gold-soft);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  header .meta .credit strong {
    color: #FFFFFF;
    font-weight: 600;
  }
  header .meta .updated {
    font-size: 0.72rem;
    color: var(--gold-soft);
    font-weight: 400;
    opacity: 0.85;
    font-variant-numeric: tabular-nums;
  }
  header .meta .count {
    font-size: 0.85rem;
    color: var(--gold-soft);
    font-weight: 400;
    margin-top: 2px;
  }
  header .meta .count strong {
    color: #FFFFFF;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ============ Main grid ============ */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
    position: relative;
    /* Defensive: ensure the grid row gets a real height even when the
       parent's 1fr resolution lags (iOS Safari URL bar transitions). */
    min-height: 0;
    height: 100%;
  }
  .main.legend-collapsed { grid-template-columns: 0 1fr; }

  /* ============ Legend / facility key ============ */
  aside.legend {
    background: var(--bg-card);
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .main.legend-collapsed aside.legend {
    transform: translateX(-100%);
    visibility: hidden;
  }
  /* Mobile-only close button at the top-right of the drawer.
     Hidden on desktop (legend is part of grid layout, not a drawer). */
  .legend-close {
    display: none;
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg);
    border-radius: 4px;
    color: var(--ink-soft);
    cursor: pointer;
    z-index: 10;
    place-items: center;
    transition: background-color 0.15s, color 0.15s;
  }
  .legend-close:hover { background: var(--navy); color: white; }
  .legend-close svg { width: 20px; height: 20px; display: block; }
  .legend-inner {
    padding: 22px 22px 28px;
  }
  .legend h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin: 0 0 4px;
    color: var(--navy);
    letter-spacing: -0.005em;
  }
  .legend .legend-sub {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    color: var(--ink);
    font: inherit;
    transition: background-color 0.15s;
  }
  .legend-item:hover { background: var(--bg); }
  .legend-item[aria-pressed="false"] { opacity: 0.42; }
  .legend-item[aria-pressed="false"] .legend-marker { filter: grayscale(0.7); }
  .legend-marker {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: filter 0.15s;
  }
  .legend-marker svg {
    width: 14px;
    height: 14px;
    display: block;
  }
  .legend-label {
    flex: 1;
    font-size: 1rem;
    line-height: 1.3;
    font-weight: 500;
  }
  .legend-count {
    flex: 0 0 auto;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    background: var(--bg);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .legend-actions {
    display: flex;
    gap: 6px;
    margin: 14px 0 6px;
  }
  .legend-actions button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font: 500 0.78rem 'Inter', sans-serif;
    padding: 7px 8px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .legend-actions button:hover { background: var(--navy); color: white; border-color: var(--navy); }

  /* ============ Map area ============ */
  .map-wrap {
    position: relative;
    overflow: hidden;
    /* Defensive: even if the grid cell is 0 pixels (iOS Safari quirk
       during URL bar transitions), force a minimum height so Leaflet
       has somewhere to render. The invalidateSize() call after load
       fixes the size once the grid resolves correctly. */
    min-height: 200px;
    height: 100%;
  }
  #map {
    position: absolute;
    inset: 0;
    background: #DDE6E9;
  }

  /* ============ Toolbar (search + filters) ============ */
  .toolbar {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .toolbar > * { pointer-events: auto; }
  .toolbar-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 6px;
    padding: 8px 8px 8px 14px;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .legend-toggle {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg);
    border-radius: 4px;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--navy);
    transition: background-color 0.15s;
  }
  .legend-toggle:hover { background: var(--gold-soft); }
  .legend-toggle svg { width: 18px; height: 18px; }

  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .search svg { flex: 0 0 auto; width: 18px; height: 18px; color: var(--ink-soft); }
  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font: 400 1.05rem 'Inter', sans-serif;
    color: var(--ink);
    padding: 6px 0;
    min-width: 0;
  }
  .search input::placeholder { color: var(--ink-soft); }
  .search-clear {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px;
    border-radius: 3px;
    display: none;
  }
  .search-clear.visible { display: grid; place-items: center; }
  .search-clear:hover { background: var(--bg); color: var(--ink); }

  .filter-toggle {
    flex: 0 0 auto;
    border: none;
    background: var(--navy);
    color: white;
    border-radius: 4px;
    padding: 0 14px;
    height: 36px;
    cursor: pointer;
    font: 500 0.95rem 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .filter-toggle:hover { background: var(--navy-deep); }
  .filter-toggle .badge {
    background: var(--gold);
    color: var(--navy-deep);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1.4;
    display: none;
  }
  .filter-toggle .badge.visible { display: inline-block; }
  .filter-toggle .chev {
    transition: transform 0.2s;
    width: 12px;
    height: 12px;
  }
  .filter-toggle.open .chev { transform: rotate(180deg); }

  .filter-panel {
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 6px;
    padding: 0;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(255,255,255,0.6);
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(.4,0,.2,1), padding 0.3s;
  }
  .filter-panel.open {
    max-height: 600px;
    padding: 18px 20px;
  }
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px 24px;
  }
  .filter-group h3 {
    font: 600 0.78rem 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--navy);
    margin: 0 0 10px;
  }
  .filter-options {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .filter-options label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
    padding: 4px 0;
  }
  .filter-options input[type="checkbox"] {
    accent-color: var(--navy);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .filter-clear {
    margin-top: 14px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
    font: 500 0.78rem 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .filter-clear:hover { background: var(--ink); color: white; border-color: var(--ink); }

  /* ============ Custom Leaflet markers ============ */
  .marker-pin {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid;
    place-items: center;
    color: white;
    font: 700 0.75rem 'Inter', sans-serif;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .marker-pin svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  .marker-pin:hover { transform: scale(1.18); z-index: 1000; }

  /* Cluster styling */
  .cluster {
    background: var(--navy);
    color: white;
    border: 3px solid var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 700 0.85rem 'Inter', sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* Leaflet tooltip override */
  .leaflet-tooltip.facility-tooltip {
    background: var(--navy-deep);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    font: 500 0.95rem 'Inter', sans-serif;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .leaflet-tooltip.facility-tooltip::before { display: none; }

  /* Boundary hover label — subtler than facility tooltips */
  .leaflet-tooltip.boundary-tooltip {
    background: rgba(255,255,255,0.94);
    color: var(--navy-deep);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 4px 9px;
    font: 600 0.78rem 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    pointer-events: none;
  }
  .leaflet-tooltip.boundary-tooltip::before { display: none; }

  /* Permanent labels rendered inside township and municipality polygons.
     The container has its anchor at (0,0) on the centroid lat/lng, so we
     translate(-50%, -50%) to center the text on that point. The text is
     drawn with a soft white halo (text-shadow) so it remains readable
     against any underlying tile color. */
  .boundary-label {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    text-align: center;
    line-height: 1.1;
    /* The white halo: multiple text-shadows simulate a glow that's
       visible on both light gray basemap and through municipality fill. */
    text-shadow:
       0  1px 0 rgba(255,255,255,0.95),
       0 -1px 0 rgba(255,255,255,0.95),
       1px 0 0 rgba(255,255,255,0.95),
      -1px 0 0 rgba(255,255,255,0.95),
       1px 1px 1.5px rgba(255,255,255,0.85),
      -1px -1px 1.5px rgba(255,255,255,0.85),
       1px -1px 1.5px rgba(255,255,255,0.85),
      -1px 1px 1.5px rgba(255,255,255,0.85);
  }
  /* Townships — subordinate styling: italic, gray, smaller */
  .township-label {
    font: italic 600 0.78rem 'Inter', sans-serif;
    color: #5A5347;
    letter-spacing: 0.02em;
  }
  /* Municipalities — primary styling: navy, slightly larger, uppercase */
  .muni-label {
    font: 700 0.85rem 'Inter', sans-serif;
    color: var(--navy-deep);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ============ Modal ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(21,41,74,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fade 0.2s;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--bg-card);
    border-radius: 8px;
    max-width: 540px;
    width: 100%;
    max-height: 88vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(21,41,74,0.35);
    animation: rise 0.25s cubic-bezier(.4,0,.2,1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head {
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--rule-soft);
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .modal-pin {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    font-weight: 700;
    font-size: 1rem;
    margin-top: 2px;
  }
  .modal-pin svg {
    width: 22px;
    height: 22px;
    display: block;
  }
  .modal-titles { flex: 1; min-width: 0; }
  .modal-type {
    font: 500 0.78rem 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .modal h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0;
    color: var(--ink);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: var(--ink-soft);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background-color 0.15s;
  }
  .modal-close:hover { background: var(--bg); color: var(--ink); }
  .modal-body {
    padding: 18px 26px 22px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-section { margin-bottom: 18px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section-label {
    font: 600 0.78rem 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--navy);
    margin-bottom: 7px;
  }
  .modal-address {
    font-size: 1.05rem;
    color: var(--ink);
    line-height: 1.5;
  }
  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .tag {
    background: var(--bg);
    color: var(--ink);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 0.85rem;
    border: 1px solid var(--rule-soft);
  }
  .tag.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--navy-deep); }
  .modal-kv {
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.5;
  }
  .modal-kv a { color: var(--navy); text-decoration: underline; text-underline-offset: 2px; }
  .modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 16px 26px 22px;
    border-top: 1px solid var(--rule-soft);
    background: var(--bg);
  }
  .modal-actions a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    border-radius: 4px;
    text-decoration: none;
    font: 600 0.95rem 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .modal-actions svg { width: 18px; height: 18px; }
  .a-map {
    background: white;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .a-map:hover { background: var(--navy); color: white; }
  .a-dir {
    background: var(--navy);
    color: white;
    border: 1px solid var(--navy);
  }
  .a-dir:hover { background: var(--navy-deep); }

  .empty-data {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.88rem;
  }

  /* ============ No-results message ============ */
  .no-results {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 18px 24px;
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    z-index: 600;
    text-align: center;
    display: none;
  }
  .no-results.show { display: block; }
  .no-results strong {
    color: var(--navy);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.05rem;
  }
  .no-results p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  /* ============ Footer note ============ */
  .footer-note {
    position: absolute;
    bottom: 8px;
    left: 16px;
    z-index: 400;
    font-size: 0.7rem;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.85);
    padding: 4px 10px;
    border-radius: 3px;
    pointer-events: none;
  }

  /* ============ Mobile responsive ============ */
  @media (max-width: 768px) {
    header {
      padding: 12px 16px 10px;
    }
    header h1 { font-size: 1.25rem; }
    header .sub, header .meta .count { display: none; }
    header .meta .credit { font-size: 0.7rem; }

/* =====================================================================
   Init map (gracefully degrade if Leaflet failed to load)
   ===================================================================== */
const leafletAvailable = typeof L !== 'undefined';
let map = null;
const markers = [];
let layerGroup = null;

if (leafletAvailable) {
  map = L.map('map', {
    zoomControl: false,
    preferCanvas: false,
    minZoom: 10,  /* prevent zooming out so far that labels become unreadable */
    maxZoom: 16   /* Esri's Light Gray Canvas tiles only go to zoom 16 */
  }).setView([41.235, -80.79], 12);  /* centered on Warren/Niles/Howland cluster */

  L.control.zoom({position: 'bottomright'}).addTo(map);

  /* ====================================================================
     BASEMAP: Esri World Light Gray Canvas
     --------------------------------------------------------------------
     This uses Esri's legacy ArcGIS Online tile service, which requires
     no API key, account, or signup — works immediately when the file
     is opened directly from disk OR served from any domain.

     IMPORTANT NOTES:
       1. This endpoint (services.arcgisonline.com) is in "mature status"
          per Esri. It still works in 2026 and Esri has indicated the
          service is being maintained for the foreseeable future, but
          they recommend new applications use their newer
          basemaps.arcgis.com service which DOES require an API key.
          If tiles ever stop loading, that's why — and we'd switch.

       2. Attribution to Esri is REQUIRED by their terms of use for the
          tile service. The attribution string in the options below
          handles this. Do not remove it.

     STYLE OPTIONS (swap "World_Light_Gray_Base" with any of these):
       - World_Light_Gray_Base  : muted gray base, ideal for data overlays (default)
       - Canvas/World_Dark_Gray_Base : dark mode equivalent
       - World_Street_Map       : full color streets
       - World_Topo_Map         : topographic with terrain
       - NatGeo_World_Map       : National Geographic style
     ==================================================================== */
  const ESRI_STYLE = 'Canvas/World_Light_Gray_Base';

  L.tileLayer(
    `https://server.arcgisonline.com/ArcGIS/rest/services/${ESRI_STYLE}/MapServer/tile/{z}/{y}/{x}`,
    {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri \u2014 Esri, DeLorme, NAVTEQ',
      crossOrigin: true
    }
  ).addTo(map);

  layerGroup = L.layerGroup().addTo(map);

  /* ====================================================================
     Township and municipality boundaries
     Source: Trumbull County GIS (webgis.co.trumbull.oh.us)
     Layer 109 = Townships (25 unincorporated townships of Trumbull County)
     Layer 108 = Admin (incorporated cities and villages)
     Both layers are fetched as GeoJSON (WGS84) and added to the map.
     Boundaries render below markers so they don't intercept clicks.
     If the fetch fails (e.g., CORS blocked, server down), the map still
     works — we silently fall through and continue without boundaries.
     ==================================================================== */
  const BOUNDARY_BASE = 'https://webgis.co.trumbull.oh.us/gisserver/rest/services/Maps/Tax_Map_WM/MapServer';
  const boundaryQuery = '/query?where=1%3D1&outFields=NAME&outSR=4326&f=geojson';

  const townshipPane = map.createPane('townships');
  townshipPane.style.zIndex = 350;  // below markers (default 600), above tiles (200)
  const munipane = map.createPane('munis');
  munipane.style.zIndex = 360;
  const labelPane = map.createPane('boundaryLabels');
  labelPane.style.zIndex = 370;     // above boundaries, still below markers
  labelPane.style.pointerEvents = 'none';  // labels never intercept clicks

  /* Track all boundary labels so we can show/hide based on zoom */
  const boundaryLabels = [];

  /* Helper: add a permanent name label at the center of a boundary feature.
     `kind` is 'township' or 'muni' — used to pick the CSS class. */
  function addBoundaryLabel(layer, displayName, kind) {
    /* getBounds().getCenter() works for both single polygons and multi-polygons.
       It's the bounding-box center, not the geometric centroid — fast and good
       enough for these mostly-rectangular shapes. */
    let center;
    try {
      center = layer.getBounds().getCenter();
    } catch (e) {
      return;  /* skip features without geometry */
    }
    const labelClass = kind === 'township' ? 'boundary-label township-label' : 'boundary-label muni-label';
    const labelMarker = L.marker(center, {
      pane: 'boundaryLabels',
      interactive: false,
      icon: L.divIcon({
        className: '',
        html: `<div class="${labelClass}">${displayName}</div>`,
        iconSize: null,  /* let CSS size the label */
        iconAnchor: [0, 0]
      })
    });
    boundaryLabels.push(labelMarker);
    labelMarker.addTo(map);
  }

  /* Show labels only at zoom 11 and above; below that, the county view
     would be cluttered. Townships start showing at zoom 11; municipalities
     get a slightly lower threshold (10) since their names are typically
     more important to residents orienting themselves. */
  function updateBoundaryLabels() {
    const z = map.getZoom();
    boundaryLabels.forEach(m => {
      const el = m.getElement();
      if (!el) return;
      const labelEl = el.querySelector('.boundary-label');
      if (!labelEl) return;
      const isTownship = labelEl.classList.contains('township-label');
      const threshold = isTownship ? 11 : 10;
      labelEl.style.display = (z >= threshold) ? '' : 'none';
    });
  }
  map.on('zoomend', updateBoundaryLabels);

  /* Townships — soft gray dashed outline */
  fetch(`${BOUNDARY_BASE}/109${boundaryQuery}`)
    .then(r => r.ok ? r.json() : null)
    .then(geo => {
      if (!geo || !geo.features) return;
      L.geoJSON(geo, {
        pane: 'townships',
        style: {
          color: '#7A7264',
          weight: 1,
          opacity: 0.45,
          fillColor: '#000',
          fillOpacity: 0,
          dashArray: '3,4'
        },
        onEachFeature: (feature, layer) => {
          const name = feature.properties && feature.properties.NAME;
          if (name) {
            const pretty = name.replace(/\s+TOWNSHIP\s*$/i, '').replace(/\s+/g, ' ').trim();
            const display = `${pretty} Twp.`;
            layer.bindTooltip(`${pretty} Township`, {
              sticky: true,
              className: 'boundary-tooltip',
              direction: 'center'
            });
            addBoundaryLabel(layer, display, 'township');
          }
          /* Boundaries should not block marker clicks */
          layer.on('add', () => {
            if (layer._path) layer._path.style.pointerEvents = 'none';
          });
        }
      }).addTo(map);
      updateBoundaryLabels();
    })
    .catch(() => { /* silent — boundaries are nice-to-have, not required */ });

  /* Cities and villages — slightly heavier solid outline */
  fetch(`${BOUNDARY_BASE}/108${boundaryQuery}`)
    .then(r => r.ok ? r.json() : null)
    .then(geo => {
      if (!geo || !geo.features) return;
      L.geoJSON(geo, {
        pane: 'munis',
        style: {
          color: '#3F4A5F',
          weight: 1.4,
          opacity: 0.75,
          fillColor: '#1F3A5F',
          fillOpacity: 0.025
        },
        onEachFeature: (feature, layer) => {
          const name = feature.properties && feature.properties.NAME;
          if (name) {
            /* For the inline label, drop the (City)/(Village) suffix to keep it short.
               The hover tooltip keeps the full designation. */
            const tooltipName = name
              .replace(/\s+CITY\s*$/i, ' (City)')
              .replace(/\s+VILLAGE\s*$/i, ' (Village)');
            const labelName = name
              .replace(/\s+CITY\s*$/i, '')
              .replace(/\s+VILLAGE\s*$/i, '')
              .trim();
            layer.bindTooltip(tooltipName, {
              sticky: true,
              className: 'boundary-tooltip',
              direction: 'center'
            });
            addBoundaryLabel(layer, labelName, 'muni');
          }
          layer.on('add', () => {
            if (layer._path) layer._path.style.pointerEvents = 'none';
          });
        }
      }).addTo(map);
      updateBoundaryLabels();
    })
    .catch(() => { /* silent fallback */ });
} else {
  document.getElementById('map').innerHTML =
    '<div style="padding:32px;max-width:520px;margin:60px auto;background:white;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center;">' +
    '<h2 style="font-family:Fraunces,Georgia,serif;font-weight:500;color:#1F3A5F;margin:0 0 12px;">Map library could not load</h2>' +
    '<p style="color:#4a5163;font-size:.9rem;line-height:1.5;margin:0 0 8px;">' +
      'This page requires an internet connection to load the map library (Leaflet) from a CDN. ' +
      'If you are seeing this message, your browser was unable to reach <code>unpkg.com</code>.' +
    '</p>' +
    '<p style="color:#4a5163;font-size:.85rem;line-height:1.5;margin:0;">' +
      'Try refreshing the page, or check that you have an active internet connection.' +
    '</p></div>';
}

/* =====================================================================
   Marker creation (only runs if Leaflet loaded)
   ===================================================================== */
function makeIcon(type) {
  const m = metaFor(type);
  const html = `<div class="marker-pin" style="background:${m.color}">${m.icon}</div>`;
  return L.divIcon({
    className: '',
    html: html,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    tooltipAnchor: [0, -16]
  });
}

if (leafletAvailable) {
  RESOURCES.forEach((r) => {
    if (typeof r.lat !== 'number' || typeof r.lng !== 'number') return;
    const marker = L.marker([r.lat, r.lng], {icon: makeIcon(r.type)})
      .bindTooltip(r.name, {className: 'facility-tooltip', direction: 'top', offset: [0, -4]})
      .on('click', () => openModal(r));
    marker._resource = r;
    markers.push(marker);
    layerGroup.addLayer(marker);
  });
}

/* =====================================================================
   Legend
   ===================================================================== */
const enabledTypes = new Set(Object.keys(TYPE_META));

function buildLegend() {
  const list = document.getElementById('legend-list');
  /* Count by type from full dataset */
  const counts = {};
  RESOURCES.forEach(r => { counts[r.type] = (counts[r.type] || 0) + 1; });

  /* Sort types by their defined order, only show types present in data */
  const types = Object.keys(TYPE_META)
    .filter(t => counts[t] > 0)
    .sort((a, b) => metaFor(a).order - metaFor(b).order);

  list.innerHTML = '';
  types.forEach(type => {
    const m = metaFor(type);
    const btn = document.createElement('button');
    btn.className = 'legend-item';
    btn.setAttribute('aria-pressed', 'true');
    btn.dataset.type = type;
    btn.innerHTML = `
      <span class="legend-marker" style="background:${m.color}">${m.icon}</span>
      <span class="legend-label">${m.short || type}</span>
      <span class="legend-count">${counts[type]}</span>
    `;
    btn.addEventListener('click', () => {
      if (enabledTypes.has(type)) enabledTypes.delete(type);
      else enabledTypes.add(type);
      btn.setAttribute('aria-pressed', enabledTypes.has(type) ? 'true' : 'false');
      applyFilters();
    });
    list.appendChild(btn);
  });
}

document.getElementById('legend-all').addEventListener('click', () => {
  Object.keys(TYPE_META).forEach(t => enabledTypes.add(t));
  document.querySelectorAll('.legend-item').forEach(b => b.setAttribute('aria-pressed', 'true'));
  applyFilters();
});
document.getElementById('legend-none').addEventListener('click', () => {
  enabledTypes.clear();
  document.querySelectorAll('.legend-item').forEach(b => b.setAttribute('aria-pressed', 'false'));
  applyFilters();
});

/* =====================================================================
   Filters panel
   ===================================================================== */
const activeFilters = {
  services: new Set(),
  access: new Set(),
  cities: new Set()
};

function buildFilters() {
  /* Services */
  const sf = document.getElementById('services-filters');
  SERVICE_FILTERS.forEach(({key, label}) => {
    const id = `f-${key}`;
    const wrap = document.createElement('label');
    wrap.innerHTML = `<input type="checkbox" id="${id}" data-group="services" data-key="${key}"><span>${label}</span>`;
    sf.appendChild(wrap);
  });

  /* Access */
  const af = document.getElementById('access-filters');
  ACCESS_FILTERS.forEach(({key, label}) => {
    const id = `f-${key}`;
    const wrap = document.createElement('label');
    wrap.innerHTML = `<input type="checkbox" id="${id}" data-group="access" data-key="${key}"><span>${label}</span>`;
    af.appendChild(wrap);
  });

  /* Cities — derived from data, sorted by count */
  const cityCounts = {};
  RESOURCES.forEach(r => {
    if (r.city) cityCounts[r.city] = (cityCounts[r.city] || 0) + 1;
  });
  const cities = Object.keys(cityCounts).sort((a, b) => cityCounts[b] - cityCounts[a]);
  const cf = document.getElementById('city-filters');
  cities.forEach(city => {
    const wrap = document.createElement('label');
    wrap.innerHTML = `<input type="checkbox" data-group="cities" data-key="${city}"><span>${city} (${cityCounts[city]})</span>`;
    cf.appendChild(wrap);
  });

  /* Wire all filter checkboxes */
  document.querySelectorAll('.filter-options input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const set = activeFilters[cb.dataset.group];
      if (cb.checked) set.add(cb.dataset.key); else set.delete(cb.dataset.key);
      updateFilterBadge();
      applyFilters();
    });
  });
}

function updateFilterBadge() {
  const total = activeFilters.services.size + activeFilters.access.size + activeFilters.cities.size;
  const badge = document.getElementById('filter-badge');
  badge.textContent = total;
  badge.classList.toggle('visible', total > 0);
}

document.getElementById('filter-clear').addEventListener('click', () => {
  activeFilters.services.clear();
  activeFilters.access.clear();
  activeFilters.cities.clear();
  document.querySelectorAll('.filter-options input').forEach(cb => cb.checked = false);
  updateFilterBadge();
  applyFilters();
});

/* Toolbar toggles */
document.getElementById('filter-toggle').addEventListener('click', () => {
  const ft = document.getElementById('filter-toggle');
  const fp = document.getElementById('filter-panel');
  const open = !fp.classList.contains('open');
  fp.classList.toggle('open', open);
  ft.classList.toggle('open', open);
  ft.setAttribute('aria-expanded', open);
});

document.getElementById('legend-toggle').addEventListener('click', () => {
  document.getElementById('main').classList.toggle('legend-collapsed');
  if (map) setTimeout(() => map.invalidateSize(), 350);
});

/* Mobile-only close button inside the legend drawer. Hidden on desktop
   (display: none in CSS), so this listener is harmless there. Always
   collapses the legend (never toggles), since this button only exists
   to dismiss an open drawer. */
document.getElementById('legend-close').addEventListener('click', () => {
  document.getElementById('main').classList.add('legend-collapsed');
  if (map) setTimeout(() => map.invalidateSize(), 350);
});

/* Mobile: legend starts collapsed */
if (window.matchMedia('(max-width: 768px)').matches) {
  document.getElementById('main').classList.add('legend-collapsed');
}

/* =====================================================================
   Search & filter logic
   ===================================================================== */
const searchInput = document.getElementById('search');
const searchClear = document.getElementById('search-clear');
let searchTerm = '';

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  searchClear.classList.toggle('visible', searchTerm.length > 0);
  applyFilters();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  searchClear.classList.remove('visible');
  applyFilters();
  searchInput.focus();
});

function matchesResource(r) {
  /* Type filter */
  if (!enabledTypes.has(r.type)) return false;

  /* Search */
  if (searchTerm) {
    const haystack = [
      r.name, r.type, r.city, r.specialty, r.addr, r.zip
    ].filter(Boolean).join(' ').toLowerCase();
    if (!haystack.includes(searchTerm)) return false;
  }

  /* Services: must match ALL selected services (AND logic) */
  for (const key of activeFilters.services) {
    if (r[key] !== 'Yes') return false;
  }

  /* Access: must match ALL selected access criteria */
  for (const key of activeFilters.access) {
    if (r[key] !== 'Yes') return false;
  }

  /* City: must be in selected cities (OR logic within group) */
  if (activeFilters.cities.size > 0 && !activeFilters.cities.has(r.city)) return false;

  return true;
}

function applyFilters() {
  let shown = 0;
  markers.forEach(m => {
    const visible = matchesResource(m._resource);
    if (visible) {
      if (layerGroup && !layerGroup.hasLayer(m)) layerGroup.addLayer(m);
      shown++;
    } else {
      if (layerGroup && layerGroup.hasLayer(m)) layerGroup.removeLayer(m);
    }
  });
  document.getElementById('count-shown').textContent = shown;
  document.getElementById('no-results').classList.toggle('show', shown === 0);
}

/* =====================================================================
   Modal
   ===================================================================== */
const backdrop = document.getElementById('modal-backdrop');
const modal = document.getElementById('modal');

function openModal(r) {
  const m = metaFor(r.type);
  const fullAddr = `${r.addr || ''}, ${r.city || ''}, ${r.state || 'OH'} ${r.zip || ''}`.replace(/^,\s*/, '').replace(/,\s*,/g, ',');
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddr)}`;
  const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(fullAddr)}`;

  /* Build services tags */
  const serviceTags = [];
  SERVICE_FILTERS.forEach(({key, label}) => {
    if (r[key] === 'Yes') serviceTags.push(`<span class="tag gold">${label}</span>`);
  });

  /* Build access tags */
  const accessTags = [];
  ACCESS_FILTERS.forEach(({key, label}) => {
    if (r[key] === 'Yes') accessTags.push(`<span class="tag">${label}</span>`);
  });

  const sectionsHtml = [];

  /* Specialty */
  if (r.specialty) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Specialty</div>
        <div class="modal-kv">${escapeHtml(r.specialty)}</div>
      </div>`);
  }

  /* Services tags */
  if (serviceTags.length > 0) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Services Offered</div>
        <div class="modal-tags">${serviceTags.join('')}</div>
      </div>`);
  }

  /* Access tags */
  if (accessTags.length > 0) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Access & Insurance</div>
        <div class="modal-tags">${accessTags.join('')}</div>
      </div>`);
  }

  /* Phone */
  if (r.phone) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Phone</div>
        <div class="modal-kv"><a href="tel:${escapeAttr(r.phone)}">${escapeHtml(r.phone)}</a></div>
      </div>`);
  }

  /* Website */
  if (r.web) {
    let url = r.web;
    if (!/^https?:\/\//.test(url)) url = 'https://' + url;
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Website</div>
        <div class="modal-kv"><a href="${escapeAttr(url)}" target="_blank" rel="noopener">${escapeHtml(r.web)}</a></div>
      </div>`);
  }

  /* Hours */
  if (r.hours) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Hours</div>
        <div class="modal-kv">${escapeHtml(r.hours)}</div>
      </div>`);
  }

  /* Walk-in / Appointment */
  if (r.walkin) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Visit Type</div>
        <div class="modal-kv">${escapeHtml(r.walkin)}</div>
      </div>`);
  }

  /* Languages */
  if (r.lang) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Languages</div>
        <div class="modal-kv">${escapeHtml(r.lang)}</div>
      </div>`);
  }

  /* Notes */
  if (r.notes) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Notes</div>
        <div class="modal-kv">${escapeHtml(r.notes)}</div>
      </div>`);
  }

  /* Verified */
  if (r.verified) {
    sectionsHtml.push(`
      <div class="modal-section">
        <div class="modal-section-label">Last Verified</div>
        <div class="modal-kv">${escapeHtml(r.verified)}</div>
      </div>`);
  }

  /* If no detail sections, show a notice */
  if (sectionsHtml.length === 0) {
    sectionsHtml.push(`
      <div class="modal-section">
        <p class="empty-data">Additional details (phone, hours, services accepted) are pending verification. Please contact the facility directly to confirm services and access.</p>
      </div>`);
  }

  modal.innerHTML = `
    <div class="modal-head">
      <div class="modal-pin" style="background:${m.color}">${m.icon}</div>
      <div class="modal-titles">
        <div class="modal-type">${escapeHtml(m.short || r.type)}</div>
        <h3 id="modal-title">${escapeHtml(r.name)}</h3>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-label">Address</div>
        <div class="modal-address">${escapeHtml(fullAddr)}</div>
      </div>
      ${sectionsHtml.join('')}
    </div>
    <div class="modal-actions">
      <a href="${escapeAttr(mapsUrl)}" target="_blank" rel="noopener" class="a-map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        View on Google Maps
      </a>
      <a href="${escapeAttr(dirUrl)}" target="_blank" rel="noopener" class="a-dir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Get Directions
      </a>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
}

backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && backdrop.classList.contains('open')) closeModal();
});

/* HTML escape helpers */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* =====================================================================
   Boot
   ===================================================================== */
buildLegend();
buildFilters();
applyFilters();

/* iOS Safari fix: when the URL bar collapses or the orientation changes,
   the map container's height changes, but Leaflet doesn't auto-detect
   parent resizes. Invalidate the map size in three situations:
     1. Shortly after initial load (URL bar may collapse 0.5s in)
     2. On window resize (covers desktop too, no harm)
     3. On orientation change (mobile rotation) */
function refreshMapSize() {
  if (map && typeof map.invalidateSize === 'function') {
    map.invalidateSize({ animate: false });
  }
}

if (map) {
  /* One-shot delayed call after page settles. 100ms catches most layout
     transitions; the second call at 600ms catches the iOS URL bar
     collapse animation, which finishes around 400-500ms. */
  setTimeout(refreshMapSize, 100);
  setTimeout(refreshMapSize, 600);

  window.addEventListener('resize', refreshMapSize);
  window.addEventListener('orientationchange', () => {
    /* Wait for the rotation animation to finish before measuring */
    setTimeout(refreshMapSize, 250);
  });

  /* When the page becomes visible again (e.g., user switches back to
     this tab on iOS Safari), the layout may have changed. Refresh. */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshMapSize();
  });
}
</script>
